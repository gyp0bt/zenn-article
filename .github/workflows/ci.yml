name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install ruff numpy scipy matplotlib pytest

      - name: Ruff format check
        run: ruff format --check simulations/

      - name: Ruff lint
        run: ruff check simulations/

      - name: Run tests
        run: python -m pytest simulations/ -v
